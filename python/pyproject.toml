[project]
name = "brava"
version = "3.0.0"
description = "BRAVA - BrAPI Validator (Python backend)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "litestar[standard]>=2.13",
    "httpx>=0.28",
    "jsonschema[format-nongpl]>=4.23",
    "referencing>=0.35",
    "msgspec>=0.19",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "apscheduler>=3.11,<4",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.5"]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2"]

[project.scripts]
brava = "brava.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brava"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]
